wq# Nginx 配置文件 - Shadcn Admin Dashboard
# 直接提供 dist 静态文件服务，通过 80 端口访问

server {
    listen 80;
    server_name localhost;

    # 字符集
    charset utf-8;

    # 访问日志和错误日志
    access_log /var/log/nginx/shadcn-admin-access.log;
    error_log /var/log/nginx/shadcn-admin-error.log;

    # 根目录指向 dist 文件夹
    root /home/steven/WebstormProjects/shadcn-admin/dist;
    index index.html;

    # 主路由配置，支持 SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}